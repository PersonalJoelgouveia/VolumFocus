name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBBl2lbUHhBO9-dOA1pNZKrUwBxIaqEX5o"
          VITE_FIREBASE_AUTH_DOMAIN: "volumfocus.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "volumfocus"
          VITE_FIREBASE_STORAGE_BUCKET: "volumfocus.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "666010218888"
          VITE_FIREBASE_APP_ID: "1:666010218888:web:eb2ac1eb67ea3adfbe0a3d"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
